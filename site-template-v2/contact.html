<section class="page-banner"{{{banner_attrs}}}>
  <div class="container">
    <span class="eyebrow">Contact</span>
    <h1>Let's talk about your project</h1>
    <p class="lead">Reach {{business_name}} directly, or send the details below and we'll follow up.</p>
    <div class="hero-ctas">
      <a class="btn btn-primary" href="tel:{{phone_tel}}">Call {{phone_display}}</a>
      <a class="btn btn-secondary" href="#quote">Get Free Quote</a>
    </div>
  </div>
</section>
{{{trust_bar}}}
<section style="padding-top:64px;">
  <div class="container two-col">
{{{contact_form}}}

    <div>
      <div class="ticket info-stub" style="margin-bottom:20px;">
        <span class="ticket-tag">Direct Contact</span>
        <div class="ticket-tear"></div>
{{{contact_rows}}}
      </div>

      <!--
        MAP_PLACEHOLDER_NOTE
        No verified street address or geocoding exists yet from the

        with guessed coordinates. Swap the div below for a real Google
        Maps (or similar) iframe once an address is collected.
      -->
      <div class="map-placeholder">Map Coming Soon</div>
    </div>
  </div>
